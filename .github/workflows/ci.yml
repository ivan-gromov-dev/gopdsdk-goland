name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, GoLand ${{ matrix.goland }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        goland: [2026.1.4, 2026.2.0.1]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew buildPlugin test "-PplatformVersion=${{ matrix.goland }}"

  compatibility:
    name: Plugin Verifier (compatibility boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify plugin
        run: ./gradlew verifyPlugin

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [test, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$COMPATIBILITY_RESULT" = success
