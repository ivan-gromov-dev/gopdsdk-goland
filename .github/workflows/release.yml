name: Package GoLand plugin

on:
  workflow_dispatch:
    inputs:
      channel:
        description: JetBrains Marketplace channel
        required: true
        default: eap
        type: choice
        options:
          - eap
          - stable
      publish:
        description: Publish after all gates pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    environment: ${{ inputs.publish && format('marketplace-{0}', inputs.channel) || 'release-package' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Require an immutable clean version
        shell: bash
        run: bash scripts/validate-release.sh "${{ inputs.channel }}" "${{ github.ref_type }}" "${{ github.ref_name }}" "${{ inputs.publish }}" >> "$GITHUB_ENV"
      - name: Test, build, and verify
        run: ./gradlew clean test buildPlugin verifyPlugin
      - name: Test newest supported GoLand
        run: ./gradlew test "-PplatformVersion=2026.2.0.1"
      - name: Verify reproducible unsigned ZIP
        shell: bash
        run: bash scripts/verify-reproducible.sh
      - name: Sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin
      - name: Verify plugin signature
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: ./gradlew verifyPluginSignature
      - name: Stage signed artifact
        shell: bash
        run: |
          mkdir -p release
          cp build/distributions/*-signed.zip "release/gopdsdk-goland-$PLUGIN_VERSION.zip"
          sha256sum "release/gopdsdk-goland-$PLUGIN_VERSION.zip" > release/SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: build/distributions
          format: spdx-json
          output-file: release/sbom.spdx.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/gopdsdk-goland-${{ env.PLUGIN_VERSION }}.zip
      - uses: actions/attest@v4
        with:
          subject-path: release/gopdsdk-goland-${{ env.PLUGIN_VERSION }}.zip
          sbom-path: release/sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: gopdsdk-goland-${{ inputs.channel }}-${{ github.run_id }}
          path: release/
          if-no-files-found: error
      - name: Publish to JetBrains Marketplace
        if: inputs.publish
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin "-PreleaseChannel=${{ inputs.channel }}"
